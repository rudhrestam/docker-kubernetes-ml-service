apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-risk-ml-service
  labels:
    app: churn-risk-ml-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-risk-ml-service
  template:
    metadata:
      labels:
        app: churn-risk-ml-service
    spec:
      containers:
        - name: ml-service
          image: churn-risk-ml-service:demo
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
